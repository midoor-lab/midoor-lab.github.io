<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Midoor Lab – Veltruby Meteo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        header {
            padding: 35px 20px;
            text-align: center;
            background: #1e293b;
        }

        h1 {
            margin: 0;
            font-size: 36px;
        }

        header p {
            color: #94a3b8;
        }

        nav {
            background: #111827;
            text-align: center;
            padding: 16px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: #38bdf8;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 25px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
        }

        .icon {
            font-size: 35px;
        }

        .value {
            font-size: 32px;
            font-weight: bold;
            margin-top: 10px;
        }

        .label {
            color: #94a3b8;
            margin-top: 5px;
        }

        .section-title {
            margin-top: 35px;
            margin-bottom: 15px;
            font-size: 24px;
        }

        .updated {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
        }

        footer {
            text-align: center;
            color: #64748b;
            padding: 30px;
        }
    </style>
</head>

<body>

<header>
    <h1>🌦️ Veltruby Meteo</h1>
    <p>Midoor Lab • vlastní meteostanice</p>
</header>

<nav>
    <a href="/">← Midoor Lab</a>
    <a href="/meteo/">Meteo</a>
</nav>

<div class="container">

    <div class="grid">

        <div class="card">
            <div class="icon">🌡️</div>
            <div class="value" id="temperature">-- °C</div>
            <div class="label">Teplota</div>
        </div>

        <div class="card">
            <div class="icon">💧</div>
            <div class="value" id="humidity">-- %</div>
            <div class="label">Vlhkost</div>
        </div>

        <div class="card">
            <div class="icon">🌧️</div>
            <div class="value" id="rain_today">-- mm</div>
            <div class="label">Srážky dnes</div>
        </div>

        <div class="card">
            <div class="icon">📊</div>
            <div class="value" id="pressure">-- hPa</div>
            <div class="label">Tlak</div>
        </div>

    </div>

    <div class="section-title">Statistiky srážek</div>

    <div class="grid">

        <div class="card">
            <div class="value" id="rain_week">-- mm</div>
            <div class="label">Posledních 7 dní</div>
        </div>

        <div class="card">
            <div class="value" id="rain_month">-- mm</div>
            <div class="label">Tento měsíc</div>
        </div>

        <div class="card">
            <div class="value" id="rain_year">-- mm</div>
            <div class="label">Tento rok</div>
        </div>

    </div>

    <div class="updated">
        Poslední aktualizace:
        <span id="updated">--</span>
    </div>

</div>

<footer>
    Midoor Lab • Veltruby Meteo
</footer>

<script>
async function loadMeteo() {
    try {
        const response = await fetch('/meteo/meteo.json?time=' + Date.now(), {
            cache: 'no-store'
        });

        if (!response.ok) {
            throw new Error('HTTP ' + response.status);
        }

        const data = await response.json();

        document.getElementById('temperature').textContent =
            Number(data.temperature).toFixed(1) + ' °C';

        document.getElementById('humidity').textContent =
            Number(data.humidity).toFixed(1) + ' %';

        document.getElementById('pressure').textContent =
            Number(data.pressure).toFixed(1) + ' hPa';

        document.getElementById('rain_today').textContent =
            Number(data.rain_today).toFixed(1) + ' mm';

        document.getElementById('rain_week').textContent =
            Number(data.rain_week).toFixed(1) + ' mm';

        document.getElementById('rain_month').textContent =
            Number(data.rain_month).toFixed(1) + ' mm';

        document.getElementById('rain_year').textContent =
            Number(data.rain_year).toFixed(1) + ' mm';

        document.getElementById('updated').textContent =
            data.updated || '--';

    } catch (error) {
        console.error('Chyba načtení meteo.json:', error);
    }
}

loadMeteo();
setInterval(loadMeteo, 60000);
</script>

</body>
</html>
